# config/docker_config.yaml
base_image: "tdh-base:latest"
network_name: "tdh-network"
volume_base: "/tmp/tdh-volumes"
timeout: 300
max_containers: 10

resource_limits:
  cpu_period: 100000
  cpu_quota: 50000  # 0.5 CPU
  memory: "512m"
  memory_swap: "1g"
  pids_limit: 100

logging:
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

security:
  read_only_rootfs: false
  privileged: false
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    - SETPCAP
    - NET_BIND_SERVICE
  security_opt:
    - "no-new-privileges:true"
    - "seccomp=unconfined"

healthcheck:
  test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 5s