# config/llm_council.yaml
# Configuración de modelos, consejo, máquina de estados y prompts.

# ----------------------------------------------------------------------
# Modelos SOTA disponibles para el consejo de seguridad
# ----------------------------------------------------------------------
llm_configs:
  claude-3.5-sonnet:
    provider: openrouter
    model: anthropic/claude-3.5-sonnet
    max_tokens: 4000
    temperature: 0.1
    priority: 1

  gemma-3-27b:
    provider: openrouter
    model: google/gemma-3-27b-it:free
    max_tokens: 4000
    temperature: 0.1
    priority: 2

  llama-3.2-3b:
    provider: openrouter
    model: meta-llama/llama-3.2-3b-instruct:free
    max_tokens: 4000
    temperature: 0.1
    priority: 3

  hermes-3-405b:
    provider: openrouter
    model: nousresearch/hermes-3-llama-3.1-405b:free
    max_tokens: 4000
    temperature: 0.1
    priority: 4
    
  qwen-coder:
    provider: openrouter
    model: qwen/qwen3-coder:free
    max_tokens: 4000
    temperature: 0.1
    priority: 5

  llama-3-3:
    provider: openrouter
    model: meta-llama/llama-3.3-70b-instruct:free
    max_tokens: 4000
    temperature: 0.1
    priority: 6

  mistral-small:
    provider: openrouter
    model: mistralai/mistral-small-3.1-24b-instruct:free
    max_tokens: 4000
    temperature: 0.1
    priority: 7

# ----------------------------------------------------------------------
# Configuración del consejo (selección, votación, tiempos)
# ----------------------------------------------------------------------
council_settings:
  min_llms: 1
  max_llms: 1
  preferred_count: 1          # Impar para votación
  timeout_seconds: 300
  enable_discussion: false

# ----------------------------------------------------------------------
# Configuración de la máquina de estados (por fase)
# ----------------------------------------------------------------------
state_machine_settings:
  max_analysis_time: 60
  max_test_design_time: 45
  max_fix_design_time: 90
  max_documentation_time: 30
  enable_state_persistence: true
  state_checkpoint_dir: "./tdh_states"

# ----------------------------------------------------------------------
# Prompts completos para cada estado del agente SOTA
# ----------------------------------------------------------------------
# Estos prompts ya incluyen TODAS las instrucciones necesarias.
# El script sota_agent.py solo debe formatearlos con las variables.
# ----------------------------------------------------------------------
state_prompts:
  test_designing:
    system: |
      Vulnerabilidad a reproducir:
      {vulnerability}

      Archivo: {repo_path}/{vuln_file}
      Línea: {line}

      Contenido actual:
      ```cpp
      {file_content}
      ```
    temperature: 0.2

  fix_designing:
    system: |
      Vulnerabilidad a corregir:
      {vulnerability}

      Archivo: {repo_path}/{vuln_file}
      Línea: {line}

      Contenido actual:
      ```cpp
      {file_content}
      ```

      Test que reproduce:
      {test_code}

      Comando de test:
      {test_command}
    temperature: 0.1

  documenting:
    system: |
      Vulnerabilidad: {vulnerability}
      Test: {test_code}
      Fix: {fix_code}
      Verificación: test_verified={test_verified}, fix_verified={fix_verified}

      Escribe una explicación en texto plano.
    temperature: 0.1

